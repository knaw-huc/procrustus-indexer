name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: python -m pip install poetry==2.0.1
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run unit tests
        run: poetry run python -m pytest -q

  lint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: python -m pip install poetry==2.0.1
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run Pylint error checks
        run: >-
          poetry run python -m pylint
          --errors-only
          --extension-pkg-allow-list=saxonche
          procrustus_indexer
