[index]
full_text="yes"
record="yes"

[index.input]
format="xml"
when="/ex:record[@status='published']"

[index.input.ns]
ex="urn:example"

[index.id]
path="/ex:record/ex:id"
type="keyword"

[index.facet.title]
path="/ex:record/ex:title"
type="text"
cardinality="single"

[index.facet.tags]
path="/ex:record/ex:tags/ex:tag"
type="keyword"
cardinality="list"

[index.facet.metadata]
path="/ex:record/ex:metadata"
type="object"
cardinality="list"
parse_json=true

[index.facet.missing]
path="/ex:record/ex:missing"
type="text"
cardinality="single"
